name: One bounded development model comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  development:
    if: github.repository == 'Gaurav711cgu/sentry-semantic-eval'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.2'
      - name: Contracts before any weight acquisition
        run: python -m unittest -v
      - name: Install fixed CPU runtime without weights
        run: |
          python -m venv /tmp/sentry-capacity-runtime
          /tmp/sentry-capacity-runtime/bin/pip install --only-binary=:all: torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          /tmp/sentry-capacity-runtime/bin/pip install --only-binary=:all: transformers==5.9.0 safetensors==0.7.0
          /tmp/sentry-capacity-runtime/bin/pip check
      - name: Wait for consumed run-specific grant, then execute offline
        env:
          PROBE_PYTHON: /tmp/sentry-capacity-runtime/bin/python
        run: |
          chmod 700 "$GITHUB_WORKSPACE"
          python run_probe.py
